name: "Variable expansion"
cases:
  - name: "Undefined variables"
    stdin: |
      echo "Undefined: ${undefined}"
      echo "Undefined: $undefined"

  - name: "Defined variables"
    stdin: |
      var=xyz
      echo "Defined: ${var}"
      echo "Defined: var"
      echo "Defined: prefix${var}suffix"
      echo "Defined: prefix$var"

  - name: "Undefined positional params"
    stdin: |
      echo "Param: $9"
      echo "Param: ${9}"

  - name: "High-numbered positional params"
    stdin: |
      echo "Param: $99"
      echo "Param: ${99}"

  - name: "Nameref indirect expansion returns target name"
    known_failure: true
    stdin: |
      target="the_value"
      declare -n ref=target
      echo "indirect: ${!ref}"
      echo "direct: $ref"

  - name: "Nameref with string operations"
    known_failure: true
    stdin: |
      target="Hello World"
      declare -n ref=target
      echo "upper: ${ref^^}"
      echo "lower: ${ref,,}"
      echo "length: ${#ref}"
      echo "substring: ${ref:0:5}"
      echo "replace: ${ref/World/Bash}"

  - name: "Nameref with default value expansion"
    known_failure: true
    stdin: |
      declare -n ref=unset_var
      echo "default: ${ref:-default_value}"
      echo "assign default: ${ref:=assigned}"
      echo "unset_var: $unset_var"

  - name: "Nameref with error expansion"
    known_failure: true
    ignore_stderr: true
    stdin: |
      declare -n ref=unset_var
      echo "${ref:?should error}" 2>/dev/null || echo "caught error"

  - name: "Nameref with alternative expansion"
    known_failure: true
    stdin: |
      target="exists"
      declare -n ref=target
      echo "${ref:+alternative}"
      unset target
      echo "'${ref:+alternative}'"

  - name: "Nameref with pattern removal"
    known_failure: true
    stdin: |
      target="/usr/local/bin/bash"
      declare -n ref=target
      echo "## */: ${ref##*/}"
      echo "%% /*: ${ref%%/*}"
      echo "# */: ${ref#*/}"
      echo "% /*: ${ref%/*}"

  - name: "Bytes joined into a character are that character"
    env:
      LC_ALL: "C.UTF-8"
    stdin: |
      a=$'\xc3'; b=$'\xa9'
      w=$a$b; echo ${#w}
      [[ $w == é ]] && echo equal
      case $w in é) echo case;; esac
      declare -A m; m[$w]=1; echo "m=${m[é]}"
      x="$a""$b"; echo ${#x}
      v=$a; v+=$b; echo ${#v}
      arr=($a); arr[0]+=$b; echo ${#arr[0]}
      declare -A m2; m2[k]=$a; m2[k]+=$b; echo ${#m2[k]}
      s=("$a" "$b"); IFS=; j="${s[*]}"; echo ${#j}

  - name: "Bytes joined into a character match as that character in patterns"
    env:
      LC_ALL: "C.UTF-8"
    stdin: |
      a=$'\xc3'; b=$'\xa9'
      [[ $a$b == $a$b ]] && echo eq1 || echo ne1
      [[ é == $a$b ]] && echo eq2 || echo ne2
      [[ é == "$a$b" ]] && echo eq3 || echo ne3
      [[ xé == x$a$b ]] && echo eq4 || echo ne4
      case é in $a$b) echo c1;; *) echo nc1;; esac
      case é in "$a$b") echo c2;; *) echo nc2;; esac
      w=xé; echo "${w#x$a$b}|${w%$a$b}|${w/$a$b/E}"
